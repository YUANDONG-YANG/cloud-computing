name: CI/CD pipeline

# When it runs: any push that touches Project 1 or this file, or the "Run workflow" button
on:
  push:
    paths:
      - "Project1/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Least privilege: jobs can only read the repo unless a job asks for more
permissions:
  contents: read

# If you push twice quickly, cancel the older run on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Every "run:" command starts inside Project1/
defaults:
  run:
    shell: bash
    working-directory: Project1

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # download the repo onto the runner
      - uses: actions/setup-python@v5      # install Python
        with:
          python-version: "3.11"
          cache: pip                        # reuse downloaded packages between runs
          cache-dependency-path: Project1/requirements-dev.txt
      - name: Install flake8
        run: pip install flake8==7.2.0
      - name: Check code style
        run: flake8 .

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                      # if 3.11 fails, still finish 3.12
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Project1/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test report
        if: always()                        # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: Project1/test-results.xml
  build:
    name: Build Docker image
    needs: [lint, test]                     # only build code that passed lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3  # modern Docker builder, needed for caching

      - name: Build image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: Project1                  # folder that holds the Dockerfile
          tags: diet-analysis:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar   # save the image as a file
          cache-from: type=gha               # reuse layers from earlier runs
          cache-to: type=gha,mode=max        # store layers for the next run

      - name: Load image and smoke test
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          docker run --rm diet-analysis:ci

      - name: Report image size
        run: |
          size=$(docker image inspect diet-analysis:ci --format '{{.Size}}')
          echo "### Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "diet-analysis:ci is $((size / 1024 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Share image with later jobs
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1                  # temporary handoff, delete after a day
  integration:
    name: Integration test (Azurite + function)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the image built earlier
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          docker tag diet-analysis:ci diet-analysis:project1   # the name docker-compose.yml expects

      - name: Prepare output folders
        run: |
          mkdir -p output simulated_nosql evidence
          chmod a+w output simulated_nosql   # the container runs as user 1000, not the runner's user

      - name: Task 1 - batch analysis in a container
        run: docker compose run --rm analysis | tee evidence/analysis.log

      - name: Task 3 - start Azurite (Blob Storage emulator)
        run: docker compose up -d --wait azurite

      - name: Task 3 - upload All_Diets.csv to Azurite
        run: docker compose run --rm upload | tee evidence/upload.log

      - name: Task 3 - run the serverless function
        run: docker compose run --rm --no-deps function | tee evidence/function.log

      - name: Check batch and function results match
        run: docker run --rm -v "$PWD:/check" -w /check diet-analysis:project1 python scripts/verify_outputs.py

      - name: Save container logs
        if: always()
        run: docker compose logs --no-color > evidence/compose.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            Project1/output/
            Project1/simulated_nosql/
            Project1/evidence/

      - name: Clean up
        if: always()
        run: docker compose down -v