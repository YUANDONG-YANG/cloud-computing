name: Cold start benchmark

on:
  push:
    paths:                                 # rerun whenever something that affects the numbers changes
      - "Project1/Dockerfile*"
      - "Project1/requirements*.txt"
      - "Project1/lambda_function.py"
      - "Project1/scripts/cold_start_benchmark.py"
      - "Project1/scripts/warm_invocations.py"
      - ".github/workflows/cold-start.yml"
  workflow_dispatch:                       # and the Run button, once this file is on main

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: Project1

jobs:
  benchmark:
    name: Measure cold start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the current image (baseline)
        run: docker build -t diet-analysis:project1 .

      - name: Start Azurite and upload All_Diets.csv
        run: |
          docker compose up -d --wait azurite
          docker compose run --rm upload

      - name: Measure baseline
        run: python3 scripts/cold_start_benchmark.py diet-analysis:project1 baseline

      - name: Build the function-only image (enhancement A)
        run: docker build -f Dockerfile.function -t diet-function:slim .

      - name: Measure slim image
        run: python3 scripts/cold_start_benchmark.py diet-function:slim slim
        
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-results
          path: Project1/evidence/

      - name: Clean up
        if: always()
        run: docker compose down -v