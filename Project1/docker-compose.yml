name: nutritional-insights
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  analysis:
    build: .
    image: diet-analysis:project1
    volumes:
      - ./output:/app/output
  upload:
    image: diet-analysis:project1
    build: .
    command: ["python", "upload_dataset.py"]
    environment:
      AZURITE_HOST: azurite
    depends_on:
      azurite:
        condition: service_healthy
  function:
    image: diet-analysis:project1
    build: .
    command: ["python", "lambda_function.py"]
    environment:
      AZURITE_HOST: azurite
    volumes:
      - ./simulated_nosql:/app/simulated_nosql
    depends_on:
      upload:
        condition: service_completed_successfully
  registry:
    image: registry:2.8.3
    profiles: ["registry"]
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - registry-data:/var/lib/registry
volumes:
  azurite-data:
  registry-data:
