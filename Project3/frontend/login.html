<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nutritional Insights Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Logo / Title -->
      <div style="text-align:center;margin-bottom:0.5rem">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);margin-bottom:0.75rem">
          <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
      </div>

      <h1 id="authTitle">Sign In</h1>
      <p class="subtitle" id="authSubtitle">Access the Nutritional Insights Dashboard</p>

      <!-- Error / Success alerts -->
      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <!-- ============ LOGIN FORM ============ -->
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      </form>

      <!-- ============ REGISTER FORM (hidden by default) ============ -->
      <form id="registerForm" style="display:none" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Repeat password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
      </form>

      <!-- Divider -->
      <div class="divider">or continue with</div>

      <!-- OAuth Buttons -->
      <div class="oauth-buttons">
        <button type="button" class="btn btn-google" onclick="oauthGoogle()">
          <svg class="oauth-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign in with Google
        </button>
        <button type="button" class="btn btn-github" onclick="oauthGitHub()">
          <svg class="oauth-icon" viewBox="0 0 24 24" fill="#fff"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          Sign in with GitHub
        </button>
      </div>

      <!-- Toggle login / register -->
      <div class="auth-toggle" id="toggleArea">
        Don't have an account? <a onclick="showRegister()">Sign up</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // API base URL (adjust for your environment)
    const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "http://localhost:7071/api"
      : "/api";

    // If already logged in, redirect to dashboard
    if (isAuthenticated()) {
      window.location.href = "dashboard.html";
    }

    // Check for OAuth redirect token
    handleOAuthRedirect();
    if (isAuthenticated()) {
      window.location.href = "dashboard.html";
    }

    /* ---------- Toggle between Login and Register ---------- */
    function showLogin() {
      document.getElementById("loginForm").style.display = "";
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("authTitle").textContent = "Sign In";
      document.getElementById("authSubtitle").textContent = "Access the Nutritional Insights Dashboard";
      document.getElementById("toggleArea").innerHTML =
        'Don\'t have an account? <a onclick="showRegister()">Sign up</a>';
      hideAlerts();
    }

    function showRegister() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "";
      document.getElementById("authTitle").textContent = "Create Account";
      document.getElementById("authSubtitle").textContent = "Register for the Nutritional Insights Dashboard";
      document.getElementById("toggleArea").innerHTML =
        'Already have an account? <a onclick="showLogin()">Sign in</a>';
      hideAlerts();
    }

    function hideAlerts() {
      document.getElementById("alertError").style.display = "none";
      document.getElementById("alertSuccess").style.display = "none";
    }

    function showError(msg) {
      const el = document.getElementById("alertError");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("alertSuccess").style.display = "none";
    }

    function showSuccess(msg) {
      const el = document.getElementById("alertSuccess");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("alertError").style.display = "none";
    }

    /* ---------- Login ---------- */
    async function handleLogin(e) {
      e.preventDefault();
      hideAlerts();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        const resp = await fetch(API_BASE + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await resp.json();

        if (resp.ok && data.token) {
          saveToken(data.token);
          saveUser(data.user || {});
          window.location.href = "dashboard.html";
        } else {
          showError(data.error || "Login failed. Please try again.");
        }
      } catch (err) {
        console.error("Login request failed:", err);
        showError("Cannot reach the server. Check that the API is running " +
                  "and that CORS allows this origin.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
      return false;
    }

    /* ---------- Register ---------- */
    async function handleRegister(e) {
      e.preventDefault();
      hideAlerts();
      const btn = document.getElementById("registerBtn");
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const confirm = document.getElementById("regConfirm").value;

      if (password !== confirm) {
        showError("Passwords do not match.");
        btn.disabled = false;
        btn.textContent = "Create Account";
        return false;
      }

      if (password.length < 8) {
        showError("Password must be at least 8 characters.");
        btn.disabled = false;
        btn.textContent = "Create Account";
        return false;
      }

      try {
        const resp = await fetch(API_BASE + "/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });
        const data = await resp.json();

        if (resp.ok && data.token) {
          saveToken(data.token);
          saveUser(data.user || {});
          window.location.href = "dashboard.html";
        } else {
          showError(data.error || "Registration failed. Please try again.");
        }
      } catch (err) {
        console.error("Registration request failed:", err);
        showError("Cannot reach the server. Check that the API is running " +
                  "and that CORS allows this origin.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
      return false;
    }

    /* ---------- OAuth ---------- */
    function oauthGoogle() {
      window.location.href = API_BASE + "/auth/oauth/google";
    }

    function oauthGitHub() {
      window.location.href = API_BASE + "/auth/oauth/github";
    }
  </script>
</body>
</html>
